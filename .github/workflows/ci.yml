# CI của XePrime.
#
# Điều quan trọng nhất ở đây là biến `REQUIRE_DB=1` trong job `api`. 51/58 spec API tự bọc mình
# bằng `dbAvailable` + `catch { return }`: không có PostgreSQL thì chúng bỏ qua trong im lặng và
# báo XANH. Trên máy dev đó là DX tốt; trên CI đó là nói dối — và mọi luật quan trọng nhất của hệ
# thống (EXCLUDE USING gist của ADR 0006, unique chống ghi kép phiếu thu, composite FK sở hữu)
# đều chỉ sống trong đúng những spec đó. `test/global-setup.ts` biến thiếu DB thành lỗi cứng.
name: CI

on:
  # CỐ Ý chỉ có `develop`, KHÔNG có `staging`/`main`: push vào hai nhánh đó chạy `deploy.yml`,
  # mà `deploy.yml` gọi lại chính file này ở job `verify`. Liệt kê chúng ở đây nữa là chạy trọn
  # bộ kiểm tra HAI LẦN cho mỗi lần phát hành — gấp đôi thời gian chờ và gấp đôi hoá đơn Actions.
  push:
    branches: [develop]
  pull_request:
  # `deploy.yml` gọi lại workflow này làm CỔNG CHẶN trước khi đẩy image lên GHCR. Gọi lại chứ
  # không chép sang file kia: hai bản kiểm tra chép nhau sẽ trôi lệch, và chỗ trôi lệch đầu tiên
  # luôn là chỗ nguy hiểm nhất.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner của GitHub chạy UTC; sản phẩm thì chỉ có MỘT múi giờ và nó là `Asia/Ho_Chi_Minh`
# (CLAUDE.md §9, ADR 0012 — tiền luôn VND, giờ luôn giờ Việt Nam). Để runner ở UTC nghĩa là CI
# kiểm một cấu hình không người dùng nào có, và mọi test dính ngày giờ trở thành đỏ/xanh tuỳ máy.
#
# ⚠️ Đây KHÔNG phải giấy phép cho code phụ thuộc giờ máy — và từ 03/09/2026 nó cũng không còn
# che được gì. Cả hai chiều đã đi qua module datetime dùng chung (`toAppTz` cho chiều API → ô
# chọn, `appWallClockToIso` cho chiều ô chọn → API), eslint chặn `import dayjs` trực tiếp trong
# mã sản phẩm, và job `web` chạy THÊM một lượt `TZ=UTC` cho phần nhạy múi giờ. Dòng này giờ chỉ
# còn để CI mô phỏng đúng môi trường thật, không phải để giấu lỗi.
env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  api:
    name: API (PostgreSQL thật)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Phải khớp ADR 0001 — PostgreSQL 16. Bản khác có thể xử lý `EXCLUDE USING gist` hay
        # `gin_trgm_ops` khác đi, và khi đó CI xanh không nói gì về production.
        image: postgres:16
        env:
          POSTGRES_USER: xeprime
          POSTGRES_PASSWORD: xeprime_dev_pw
          POSTGRES_DB: xeprime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xeprime -d xeprime_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Mọi script db/api đều chạy qua `dotenv -e ../../.env`, nên file này phải có TRƯỚC bước
      # build đầu tiên (`prisma generate` cũng đọc nó).
      #
      # DATABASE_URL và TEST_DATABASE_URL cùng trỏ một chỗ là CÓ CHỦ ĐÍCH: luật
      # "phải có TEST_DATABASE_URL riêng" sinh ra để bảo vệ database dev của người đang code,
      # còn ở đây database là container dùng một lần của đúng run này.
      - name: Dựng .env cho CI
        run: |
          cp .env.example .env
          DB='postgresql://xeprime:xeprime_dev_pw@localhost:5432/xeprime_test?schema=public'
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=\"$DB\"|"           .env
          sed -i "s|^TEST_DATABASE_URL=.*|TEST_DATABASE_URL=\"$DB\"|" .env

      # BẮT BUỘC trước typecheck/test: `dist/` bị gitignore mà mọi package dùng chung đều
      # resolve về đó (`main: ./dist/index.js`). Thiếu bước này thì CI đỏ vì module-not-found,
      # không phải vì nghiệp vụ sai. Nháy quanh `./packages/*` là bắt buộc — không có nó shell
      # glob-expand thành từng thư mục và làm hỏng cờ --filter.
      - run: pnpm --filter @xeprime/prisma --filter "./packages/*" -r build

      - run: pnpm db:deploy
      - name: Seed dữ liệu nền
        # Chỉ quyền/role/danh mục — KHÔNG dựng 5 gian hàng demo. Spec tự tạo dữ liệu của nó;
        # seed demo chỉ làm run chậm và làm mờ ranh giới "test này dựng gì".
        run: SEED_MODE=system pnpm db:seed

      - name: Test API — thiếu DB là ĐỎ
        run: pnpm --filter @xeprime/api test
        env:
          REQUIRE_DB: '1'

      - run: pnpm --filter @xeprime/api typecheck
      - run: pnpm --filter @xeprime/api lint

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      # BẮT BUỘC trước typecheck/test: `dist/` bị gitignore mà mọi package dùng chung đều
      # resolve về đó (`main: ./dist/index.js`). Thiếu bước này thì CI đỏ vì module-not-found,
      # không phải vì nghiệp vụ sai. Nháy quanh `./packages/*` là bắt buộc — không có nó shell
      # glob-expand thành từng thư mục và làm hỏng cờ --filter.
      - run: pnpm --filter @xeprime/prisma --filter "./packages/*" -r build

      - run: pnpm --filter @xeprime/web test
      - run: pnpm --filter @xeprime/web typecheck
      - run: pnpm --filter @xeprime/web lint
      # Parity vi↔en + ICU + không giá trị rỗng. Rẻ và chặn đúng thứ review của người hay bỏ sót.
      - run: pnpm --filter @xeprime/web i18n:check
      - run: pnpm --filter @xeprime/types test
      - run: pnpm --filter @xeprime/domain test

      # Lượt thứ hai, KHÁC múi giờ máy.
      #
      # `env.TZ` ở đầu file ghim runner về giờ Việt Nam để CI giống môi trường thật. Cái giá là
      # mọi lỗi "diễn giải theo giờ máy" đều vô hình — đúng cách món nợ DatePicker sống sót tới
      # 03/09/2026. Chạy lại phần nhạy múi giờ với `TZ=UTC` là chỗ nó không trốn được: bộ test
      # datetime của `@xeprime/domain` tự xoay ba múi giờ, còn ba file web dưới đây là hai đầu
      # dây thật (hộp chọn khoảng thuê · form đơn thuê · link tìm kiếm).
      #
      # Chỉ chạy phần nhạy múi giờ chứ không chạy lại cả bộ web: cả bộ mất vài phút và không
      # thêm bảo đảm nào mà bốn file này chưa cho.
      - name: Kiểm lại phần nhạy múi giờ với TZ=UTC
        env:
          TZ: UTC
        run: |
          pnpm --filter @xeprime/domain test
          pnpm --filter @xeprime/web test src/components/form/RentalRangePanel.test.tsx
          pnpm --filter @xeprime/web test src/features/bookings/components/booking-form-timezone.test.tsx
          pnpm --filter @xeprime/web test src/features/marketplace/search/search-draft.test.ts

  # ---------------------------------------------------------------------------
  # Build image — CỔNG CHẶN, không đẩy đi đâu.
  #
  # Hai job trên chạy test/typecheck/lint; KHÔNG job nào chạy `next build` hay `nest build`.
  # Đó là khoảng hở thật: một lỗi chỉ lộ ra lúc build (import vòng, `use client` thiếu, biến
  # NEXT_PUBLIC_* dùng ở chỗ không có) sẽ đi lọt qua CI xanh và nổ giữa lúc deploy — lúc đó
  # stack đã migrate xong và đang chờ container không bao giờ lên.
  #
  # Build ở đây cũng HÂM NÓNG cache GHA cho job đẩy image của deploy.yml: cùng `type=gha`, nên
  # lần build thật sau đó gần như chỉ còn tải layer về và push.
  # ---------------------------------------------------------------------------
  build:
    name: Build image (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (không push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `NEXT_PUBLIC_*` bị Next NHÚNG CỨNG vào bundle lúc build, nên chúng là một phần của
          # định danh layer. Lấy từ repository Variables (không phải Environment — job này chạy
          # cả trên PR, nơi không có Environment nào) để giá trị KHỚP với lần build đẩy lên
          # GHCR; lệch một ký tự là cache miss toàn bộ tầng build web.
          #
          # Không có gì bí mật ở đây theo đúng nghĩa đen: mọi giá trị này nằm lộ thiên trong
          # file JS mà trình duyệt tải về.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api-stg.xeprime.vn' }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'XePrime' }}
            NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            SESSION_COOKIE_NAME=${{ vars.SESSION_COOKIE_NAME || 'xp_session' }}
