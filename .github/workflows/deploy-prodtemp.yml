# Deploy PRODUCTION TẠM (xeprime.vn chạy nhờ trên máy staging — runbook Phụ lục A).
#
# Kích hoạt: push nhánh `prodtemp`. Nhánh này luôn nhận merge TỪ `staging` (không bao giờ commit
# thẳng): file compose/script của bản tạm được đọc từ checkout của staging trên VPS, nên staging
# phải có chúng trước (deploy/prodtemp/deploy.sh, đầu file).
#
# Environment GitHub RIÊNG `prodtemp` — không đọc gì của `staging`, nên thêm/sửa biến ở đây không
# chạm staging và ngược lại. Nó chỉ giữ thứ workflow cần (khai đủ ở runbook Phụ lục A.3):
#   Secrets:   VPS_HOST · VPS_SSH_KEY (khoá RIÊNG, bị khoá lệnh — deploy/prodtemp/ssh-gate.sh)
#              · VPS_KNOWN_HOSTS
#   Variables: WEB_DOMAIN · PARTNER_DOMAIN · ADMIN_DOMAIN · API_DOMAIN · NEXT_PUBLIC_APP_NAME
#              · SESSION_COOKIE_NAME · NEXT_PUBLIC_FIREBASE_{API_KEY,PROJECT_ID,AUTH_DOMAIN,APP_ID}
#              · VPS_USER (tuỳ chọn) · VPS_SSH_PORT (tuỳ chọn)
# Cấu hình LÚC CHẠY của app (khoá dịch vụ, database, secret phiên) nằm ở `.env.prodtemp` trên VPS
# (deploy/prodtemp/make-env.sh) — không ở đây.
#
# Vì sao không dùng deploy.yml: nó dựng `.env.<môi trường>` từ GitHub Environment và chạy
# docker-compose.prod.yml — tức là một Caddy THỨ HAI tranh cổng 80/443 với staging trên cùng máy.
#
# Khi lên production thật: xoá file này, nhánh `prodtemp`, Environment `prodtemp` và thư mục
# deploy/prodtemp/ (Phụ lục A.4).
name: Deploy prodtemp

on:
  push:
    branches: [prodtemp]

# Không cắt ngang một lần deploy đang migrate (cùng lý do với deploy.yml).
concurrency:
  group: deploy-prodtemp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production tạm
    runs-on: ubuntu-latest
    environment: prodtemp
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Thiếu một Variable là dừng NGAY, trước 15 phút build — không phải phát hiện ở smoke test
      # rằng web nhúng URL rỗng.
      - name: Kiểm Environment prodtemp
        env:
          V_WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          V_PARTNER_DOMAIN: ${{ vars.PARTNER_DOMAIN }}
          V_ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
          V_API_DOMAIN: ${{ vars.API_DOMAIN }}
          V_NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          V_SESSION_COOKIE_NAME: ${{ vars.SESSION_COOKIE_NAME }}
          V_NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          V_NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          V_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          V_NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          S_VPS_HOST: ${{ secrets.VPS_HOST }}
          S_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          S_VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          MISSING=''
          for K in $(env | grep -oE '^[VS]_[A-Z_]+' | sort); do
            [ -n "$(printenv "$K")" ] || MISSING="$MISSING ${K#?_}"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Environment prodtemp thiếu:$MISSING (runbook Phụ lục A.3)"
            exit 1
          fi

      - id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO_LC="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${REPO_LC}:prodtemp-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # URL ba site của production NHÚNG CỨNG vào bundle web (deployment.md §9.3) — vì thế image
      # này không bao giờ là image của staging, và ngược lại.
      - name: Build 4 image
        uses: docker/bake-action@v6
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          CACHE: gha
          CACHE_SCOPE: xeprime-prodtemp
          NEXT_PUBLIC_WEB_MARKET_URL: https://${{ vars.WEB_DOMAIN }}
          NEXT_PUBLIC_WEB_PARTNER_URL: https://${{ vars.PARTNER_DOMAIN }}
          NEXT_PUBLIC_WEB_ADMIN_URL: https://${{ vars.ADMIN_DOMAIN }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          # Phải TRÙNG `SESSION_COOKIE_NAME` trong `.env.prodtemp` (giá trị lúc chạy thắng — đây
          # chỉ là đai an toàn, xem deploy/Dockerfile).
          SESSION_COOKIE_NAME: ${{ vars.SESSION_COOKIE_NAME }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        with:
          source: .
          files: deploy/docker-bake.hcl
          load: true

      # Chạy thử TRƯỚC khi đẩy: image hỏng không bao giờ lên GHCR, VPS không bao giờ thấy nó.
      - name: Chạy thử 4 image
        run: bash deploy/scripts/smoke-images.sh '${{ steps.img.outputs.image }}'

      - name: Đẩy lên GHCR
        run: |
          set -euo pipefail
          for ROLE in web api worker tools; do
            docker push '${{ steps.img.outputs.image }}'-"$ROLE"
          done

      - name: Chuẩn bị SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Khoá này bị `command=` trên VPS ép đi qua deploy/prodtemp/ssh-gate.sh: chỉ câu
      # `deploy <tag prodtemp-…>` được nhận. KHÔNG `git checkout` trên VPS — thư mục đó là checkout
      # của STAGING, đổi nó ở đây là staging chạy image cũ với compose mới.
      - name: Deploy lên VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ vars.VPS_USER }}
          PORT: ${{ vars.VPS_SSH_PORT }}
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -p "${PORT:-22}" -o BatchMode=yes \
            "${USER_NAME:-xeprime}@$HOST" "deploy $IMAGE"

      # Từ BÊN NGOÀI: DNS, chứng chỉ TLS, khối Caddy và realm theo host — thứ healthcheck nội bộ
      # không nhìn thấy. Lần đầu Caddy còn đang xin chứng chỉ nên retry rộng tay.
      - name: Smoke test
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          PARTNER_DOMAIN: ${{ vars.PARTNER_DOMAIN }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
        run: |
          set -euo pipefail
          C=(curl -sS --retry 10 --retry-delay 6 --retry-all-errors --max-time 20)
          "${C[@]}" -f "https://$API_DOMAIN/health" | grep -q '"status":"ok"'
          echo "GET https://$API_DOMAIN/health -> ok"
          for HOST in "$WEB_DOMAIN" "$PARTNER_DOMAIN" "$ADMIN_DOMAIN"; do
            CODE="$("${C[@]}" -o /dev/null -w '%{http_code}' "https://$HOST/")"
            echo "GET https://$HOST/ -> $CODE"
            case "$CODE" in 2*|3*) ;; *) echo "::error::$HOST trả $CODE"; exit 1 ;; esac
            "${C[@]}" -f "https://$HOST/api/health" | grep -q '"status":"ok"' \
              || { echo "::error::https://$HOST/api/health không về tới API"; exit 1; }
          done

      - name: Tóm tắt
        if: always()
        run: |
          {
            echo "### Production tạm"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.img.outputs.image }}\` |"
            echo "| Site | https://${{ vars.WEB_DOMAIN }} · https://${{ vars.PARTNER_DOMAIN }} · https://${{ vars.ADMIN_DOMAIN }} |"
            echo "| API | https://${{ vars.API_DOMAIN }}/health |"
            echo ""
            echo "Rollback: trên VPS chạy \`./deploy/prodtemp/deploy.sh --image <tag prodtemp-… trước đó>\`."
          } >> "$GITHUB_STEP_SUMMARY"
