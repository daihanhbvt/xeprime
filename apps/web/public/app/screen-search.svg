  <rect x="200" y="186" width="158" height="24" rx="8" fill="#d6a02c"/>

  <!-- chip lọc -->
  <rect x="16" y="242" width="78" height="28" rx="14" fill="#fdf6e3" stroke="#d6a02c"/>
