  <rect x="302" y="242" width="72" height="28" rx="14" fill="#ffffff" stroke="#e8e4dd"/>

  <!-- thẻ xe 1 -->
  <rect x="16" y="290" width="358" height="200" rx="14" fill="#ffffff" stroke="#e8e4dd"/>
  <rect x="16" y="290" width="358" height="116" rx="14" fill="#ece8e1"/>
