<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-hidden="true">
  <!--
    ẢNH MINH HOẠ TẠM — màn tìm xe của app native.

    Đây KHÔNG phải ảnh chụp màn hình thật: app chưa phát hành. Nó là một phác thảo khối, cố ý
    không có chữ nào (để không phải dịch, và để không giả vờ là giao diện thật).

    Thay bằng ảnh thật: ghi đè đúng file này, giữ tỉ lệ 390×844 (9:19.5) — trang không phải sửa.
    Màu lấy từ bảng token XePrime: nền #faf9f7, vàng #d6a02c, chữ #1a1a1a, viền #e8e4dd.
  -->
  <rect width="390" height="844" fill="#faf9f7"/>

  <!-- thanh trạng thái + header -->
  <rect x="0" y="0" width="390" height="96" fill="#ffffff"/>
  <rect x="24" y="34" width="86" height="12" rx="6" fill="#d6a02c"/>
  <circle cx="352" cy="66" r="14" fill="#f5f3ef"/>
  <rect x="24" y="58" width="150" height="9" rx="4.5" fill="#e8e4dd"/>

  <!-- thẻ tìm kiếm -->
  <rect x="16" y="112" width="358" height="112" rx="14" fill="#ffffff" stroke="#e8e4dd"/>
