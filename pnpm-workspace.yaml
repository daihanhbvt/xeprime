# Tắt kiểm tra deps trước mỗi `pnpm run/exec`. Mặc định pnpm 11 chạy lại `pnpm install`
# ngầm trước mỗi lệnh; ở đây nó fail vì vài build script bị chặn (không sinh binary cần
# thiết) và làm hỏng mọi lệnh con. Deps đã cài đủ nên tắt là an toàn.
verifyDepsBeforeRun: false

# GHIM expo-font về bản của Expo SDK 54.
#
# `@expo/vector-icons@15.1.1` khai peer `expo-font: ">=14.0.4"` — một range MỞ, nên pnpm chọn
# `expo-font@57.0.1` (của SDK 57) và dựng một biến thể vector-icons trỏ vào đó. Ở tầng JS không
# ai thấy gì; ở tầng NATIVE thì `FontLoaderModule` của bản 57 gọi
# `ReturnTypeKt.getDirectConverter` — API mà `expo-modules-core@3.0.30` của SDK 54 chưa có.
#
# Triệu chứng là app Android CHẾT NGAY khi mở, `NoSuchMethodError` trong logcat và **không có
# một dòng lỗi JS nào** ở Metro — vì nó chết trước khi runtime JS kịp chạy. Chỉ lộ ra sau một
# lần `expo prebuild` + build lại, nên rất dễ đổ oan cho thay đổi code gần nhất.
#
# Bỏ dòng này thì phải kiểm lại `pnpm why expo-font` chỉ còn MỘT phiên bản.
overrides:
  expo-font: 14.0.12

# KHAI PEER `react`/`react-native` cho react-native-calendars.
#
# Package đó không khai peerDependencies nào cả, nên pnpm chẳng có gì để nối và phép resolve
# của Node leo lên `.pnpm/node_modules` — nơi đang treo `react@19.2.x` của `apps/web`, trong khi
# `apps/mobile` chạy `react@19.1.x`. Hai bản React trong một cây là dispatcher `null`:
# `Cannot read properties of null (reading 'useState')` ném ra từ trong lòng thư viện, không
# phải từ code app.
packageExtensions:
  react-native-calendars:
    peerDependencies:
      react: '*'
      react-native: '*'

# Giữ lại cho pnpm 10; pnpm 11 bỏ qua khóa này và đọc `allowBuilds` ở cuối file.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.4'
  - lint-staged@17.1.1
  - ts-jest@29.4.12

# pnpm 11 thay `onlyBuiltDependencies` bằng map này. Thiếu nó thì postinstall bị chặn và
# `pnpm install` fail bằng ERR_PNPM_IGNORED_BUILDS sau khi đã cài xong package.
# Prisma tải engine; esbuild/sharp/unrs-resolver/re2 cần native binary. Nhóm false là
# telemetry/tuỳ chọn, không cần chạy.
allowBuilds:
  '@firebase/util': false
  # next-intl kéo theo @parcel/watcher + @swc/core cho bộ trích message lúc build (SWC
  # plugin) mà repo không dùng. Cả hai đã có sẵn binary qua optionalDependencies theo nền
  # tảng nên postinstall chỉ là bước kiểm tra thừa; thiếu khai báo thì `pnpm install` dừng
  # bằng ERR_PNPM_IGNORED_BUILDS sau khi đã cài xong package.
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': false
  esbuild: true
  prisma: true
  protobufjs: false
  re2: true
  sharp: true
  unrs-resolver: true
