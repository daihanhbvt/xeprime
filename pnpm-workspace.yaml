packages:
  - apps/*
  # Hai app mobile phát hành riêng + package shared (tách 25/09/2026). `apps/*` không còn khớp
  # `apps/mobile` vì thư mục đó thôi mang package.json — nó chỉ là cái vỏ chứa ba package con.
  - apps/mobile/*
  - packages/*
  - prisma

# MỘT chỗ ghim version cho bộ dependency mobile dùng chung ba package (customer · manage ·
# shared): nâng Expo/RN/Tamagui là sửa Ở ĐÂY, ba package.json chỉ ghi `catalog:`. Hai app lệch
# version React Native là hai native binary khác nhau cùng đọc một `shared/src` — lỗi chỉ lộ
# lúc chạy.
catalog:
  '@expo/metro-runtime': ~6.1.2
  '@expo/vector-icons': ^15.0.3
  '@formatjs/intl-datetimeformat': 7.6.0
  '@formatjs/intl-getcanonicallocales': 3.2.11
  '@formatjs/intl-locale': 5.3.10
  '@formatjs/intl-numberformat': 9.4.0
  '@formatjs/intl-pluralrules': 6.3.13
  '@hookform/resolvers': 5.4.0
  '@react-native-firebase/app': ^26.4.0
  '@react-native-firebase/messaging': ^26.4.0
  '@reduxjs/toolkit': 2.12.0
  '@tamagui/animations-react-native': 2.7.7
  '@tamagui/babel-plugin': 2.7.7
  '@tamagui/core': 2.7.7
  '@tamagui/toast': 2.7.7
  '@tanstack/react-query': 5.101.4
  '@testing-library/react-native': 14.0.1
  '@types/jest': 29.5.14
  '@types/react': ~19.1.0
  dayjs: 1.11.21
